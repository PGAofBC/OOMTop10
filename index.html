<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tagmarshal Cup Top 10 — Order of Merit</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#d42626; --accent-dark:#b01d1d; --tick:#5db47d;
    --ink:#111; --muted:#7e858a; --row-a:#f5f6f7; --row-b:#eaefed;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;overflow-x:hidden;}
  body{font-family:'Archivo',-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);background:#fff;
    -webkit-text-size-adjust:100%;}

  /* ---------- header ---------- */
  .head{background:repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 1px, transparent 1px 46px), linear-gradient(155deg,#22794a 0%, #175733 100%);color:#fff;padding:18px 18px 20px;position:relative;overflow:hidden;}
  .head::after{content:'';position:absolute;z-index:0;right:-30%;bottom:-40%;width:180%;height:3px;
    background:var(--accent);transform:rotate(38deg);transform-origin:right center;opacity:.85;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2;}
  .logo{height:52px;width:auto;}
  .tagpill{background:#a3beae;color:#123f27;border-radius:999px;padding:7px 13px;
    font-size:.72rem;font-weight:700;white-space:nowrap;}
  .headblock{position:relative;z-index:2;margin-top:18px;}
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:.62rem;font-weight:700;letter-spacing:.22em;
    color:#dbe8e0;text-transform:uppercase;}
  .eyebrow::before{content:'';width:20px;height:3px;background:var(--accent);flex:0 0 auto;}
  h1{font-weight:900;font-style:italic;text-transform:uppercase;font-size:1.85rem;line-height:1.0;
    letter-spacing:.005em;margin:9px 0 7px;}
  .season{color:#c3d6ca;font-size:.82rem;font-weight:500;}
  .updated{color:#8fae9b;font-size:.7rem;margin-top:2px;min-height:1em;}
  .fulllink{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;
    background:var(--accent);color:#fff;text-decoration:none;font-size:.85rem;font-weight:700;
    padding:13px 18px;border-radius:9px;position:relative;z-index:2;}
  .fulllink:active{background:var(--accent-dark);}
  .fulllink:focus-visible{outline:3px solid #fff;outline-offset:2px;}

  /* ---------- podium ---------- */
  .podium{background:#175733;padding:0 14px 16px;display:flex;flex-direction:column;gap:9px;
    position:relative;z-index:2;}
  .card{border:1px solid #3a7a55;border-radius:13px;display:flex;align-items:center;gap:11px;
    padding:11px 13px;color:#fff;background:repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 1px, transparent 1px 30px), linear-gradient(120deg,#2d6a48,#215239);}
  .card.leader{padding:15px 14px;border-color:#4a8f66;}
  .badge{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid #6ea886;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-style:italic;
    font-size:1rem;color:#fff;background:#1a4c31;}
  .card.leader .badge{width:42px;height:42px;font-size:1.2rem;border-color:#8dc0a2;}
  .who{flex:1 1 auto;min-width:0;}
  .who .lbl{font-size:.58rem;font-weight:700;letter-spacing:.26em;color:#b3cfbe;
    text-transform:uppercase;margin-bottom:2px;}
  .who .nm{font-weight:800;font-style:italic;font-size:1.02rem;line-height:1.15;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card.leader .who .nm{font-size:1.22rem;}
  .who .fac{font-size:.72rem;font-style:italic;color:#b3cfbe;font-weight:500;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ptsblock{flex:0 0 auto;text-align:right;padding-left:4px;}
  .ptsblock .pts{font-weight:900;font-style:italic;font-size:1.5rem;line-height:1;}
  .card.leader .ptsblock .pts{font-size:2.2rem;}
  .ptsblock .sub{font-size:.54rem;font-weight:700;letter-spacing:.22em;color:#b3cfbe;
    text-transform:uppercase;margin-top:3px;}

  /* ---------- list ---------- */
  .listhead{display:flex;align-items:center;font-size:.6rem;font-weight:800;letter-spacing:.12em;
    color:#2f7d4e;text-transform:uppercase;padding:14px 16px 7px;
    border-bottom:3px solid #2f7d4e;margin:0 4px;}
  .listhead .h-rank{width:46px;}
  .listhead .h-pts{margin-left:auto;}
  .row{display:flex;align-items:center;padding:11px 16px;min-height:60px;}
  .row:nth-child(odd){background:var(--row-a);}
  .row:nth-child(even){background:var(--row-b);}
  .row .rk{width:46px;display:flex;align-items:center;gap:7px;flex:0 0 auto;}
  .row .rk::before{content:'';width:4px;height:26px;background:var(--tick);flex:0 0 auto;}
  .row .rk span{font-weight:800;font-style:italic;font-size:1.15rem;}
  .row .id{min-width:0;flex:1 1 auto;padding-right:10px;}
  .row .nm{font-weight:800;font-size:1.02rem;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .fac{font-size:.75rem;font-style:italic;color:var(--muted);font-weight:500;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .pt{flex:0 0 auto;font-weight:900;font-style:italic;font-size:1.5rem;}
  .status{padding:28px 16px;color:var(--muted);font-size:.88rem;}
  .status.error{color:var(--accent);}
  .footbar{height:7px;background:linear-gradient(90deg,#217441 0%, #33a05a 45%, #d42626 100%);}

  /* very narrow phones */
  @media (max-width:340px){
    h1{font-size:1.6rem;}
    .row .nm,.who .nm{font-size:.95rem;}
    .row .pt{font-size:1.3rem;}
    .card.leader .ptsblock .pts{font-size:1.9rem;}
  }
</style>
</head>

<script>
var SOURCE_URL = 'https://pgaofbc.github.io/OOM/tagmarshal-cup-standings.html';
var RANK_COL = 0, NAME_COL = 1, FAC_COL = 2, TOTAL_COL = 8;

function fmtPts(v){
  var n=parseFloat(v); if(isNaN(n)) return '0';
  return (Math.round(n*100)/100).toString();
}

function load(){
  fetch(SOURCE_URL+'?cb='+Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(function(html){
      var block = html.match(/const DATA = `([\s\S]*?)`;/);
      if(!block) throw new Error('standings data not found');
      var top = block[1].trim().split('\n').map(function(line){
        var c = line.split('|');
        return { rank: parseInt(c[RANK_COL],10),
                 name: displayName(c[NAME_COL]),
                 fac: String(c[FAC_COL]||'').trim(),
                 pts: fmtPts(c[TOTAL_COL]) };
      }).filter(function(m){ return !isNaN(m.rank); }).slice(0,10);
      if(!top.length) throw new Error('no players found');
      var asOf = html.match(/As of ([A-Za-z]+ \d{1,2}, \d{4})/);
      paint(top, asOf ? 'As of '+asOf[1] : '');
    })
    .catch(function(err){ showError(err.message); });
}

/* ---- shared rendering ---- */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function displayName(n){
  n=String(n||'').trim();
  if(n.indexOf(',')>-1){var p=n.split(',');return (p[1]||'').trim()+' '+(p[0]||'').trim();}
  return n;
}
function ordinal(n){return n+(n===1?'st':n===2?'nd':n===3?'rd':'th');}

function paint(top, stamp){
  var html='';
  top.slice(0,3).forEach(function(m,i){
    var lead=(i===0);
    html+='<div class="card'+(lead?' leader':'')+'">'
        +'<div class="badge">'+m.rank+'</div>'
        +'<div class="who">'+(lead?'<div class="lbl">Leader</div>':'')
        +'<div class="nm">'+esc(m.name)+'</div>'
        +'<div class="fac">'+esc(m.fac||'\u2014')+'</div></div>'
        +'<div class="ptsblock"><div class="pts">'+m.pts+'</div>'
        +'<div class="sub">'+(lead?'Points':ordinal(m.rank))+'</div></div>'
      +'</div>';
  });
  document.getElementById('podium').innerHTML=html;

  var list='';
  top.slice(3).forEach(function(m){
    list+='<div class="row">'
        +'<div class="rk"><span>'+m.rank+'</span></div>'
        +'<div class="id"><div class="nm">'+esc(m.name)+'</div>'
        +'<div class="fac">'+esc(m.fac||'\u2014')+'</div></div>'
        +'<div class="pt">'+m.pts+'</div>'
      +'</div>';
  });
  document.getElementById('rows').innerHTML = list || '<div class="status">No standings yet.</div>';
  document.getElementById('updated').textContent = stamp || '';
  reportHeight();
}

function showError(msg){
  document.getElementById('rows').innerHTML =
    '<div class="status error">Could not load the standings ('+esc(msg)+'). It will retry automatically.</div>';
  reportHeight();
}

/* Tells a host page how tall this embed is, so the iframe can resize itself.
   Harmless if the host isn't listening. */
function reportHeight(){
  try{
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(window.parent && window.parent !== window){
      window.parent.postMessage({pgabcEmbed:'oom', height:h}, '*');
    }
  }catch(e){}
}
window.addEventListener('resize', reportHeight);
window.addEventListener('load', reportHeight);

load();
setInterval(load, 15*60*1000);
</script>
</body>
</html>
